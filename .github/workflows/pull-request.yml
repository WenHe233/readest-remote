name: Readest Remote checks

on:
  workflow_dispatch:
  workflow_call:
  push:
    branches: [main, feat/external-plugins-v2]
  pull_request:
    branches: [main, feat/external-plugins-v2]

permissions:
  contents: read

jobs:
  workflows:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate workflows
        run: >-
          docker run --rm -v "$PWD:/repo:ro" --workdir /repo
          rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
          -no-color
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: '24.20.0'
      - name: Check release tooling
        run: node --test scripts/ci/*.test.mjs

  windows:
    runs-on: windows-2025
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-readest
        with:
          frontend: test
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable action, pinned toolchain below
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          key: remote-remote-windows-checks
          cache-on-failure: 'true'
          cache-all-crates: 'true'
          cache-workspace-crates: 'true'
      - name: Lint and complete unit suite
        run: |
          pnpm format:check
          pnpm lint
          pnpm exec biome lint --config-path packages/plugin-sdk/biome.json packages/plugin-sdk/src
          pnpm --filter @readest/readest-app test:pr:web:unit
      - name: Build test-signed plugins and independent SDK consumer
        run: |
          node scripts/ci/sign-plugins.mjs --test
          pnpm --dir packages/plugin-sdk pack --out "$GITHUB_WORKSPACE/.v2-artifacts/readest-plugin-sdk.tgz"
          node scripts/ci/prepare-sdk-consumer.mjs "$RUNNER_TEMP/sdk-consumer"
          pnpm --dir "$RUNNER_TEMP/sdk-consumer" install --ignore-scripts --prefer-offline
          node scripts/build-plugins.mjs --plugin "$RUNNER_TEMP/sdk-consumer" --dev             --key "$RUNNER_TEMP/readest-sdk-test.pem" --out .v2-artifacts/sdk-independent
          rm "$RUNNER_TEMP/readest-sdk-test.pem"
      - name: Chromium and plugin lifecycle tests
        working-directory: apps/readest-app
        env:
          READEST_PLUGIN_TEST_REPOSITORY: ${{ github.workspace }}/.v2-artifacts/ci-repository
        run: |
          pnpm exec playwright install chromium
          # Keep timing assertions independent of other browser test files.
          pnpm test:browser --no-file-parallelism
          pnpm exec vitest run --config vitest.plugins.config.mts             lifecycle.plugin.test.ts cache.plugin.test.ts ui.plugin.test.ts isolation-native.plugin.test.ts
      - name: Native plugin CSP in WebKit
        working-directory: apps/readest-app
        run: |
          pnpm exec playwright install webkit
          pnpm exec vitest run --config vitest.plugin-webkit.config.mts
      - name: Rust and thumbnail gates
        run: |
          cargo fmt -p Readest --check
          cargo clippy --locked -p Readest --no-deps -- -D warnings
          cargo test --locked -p Readest --lib
          cargo fmt --manifest-path apps/readest-app/extensions/windows-thumbnail/Cargo.toml --check
          cargo clippy --locked --manifest-path apps/readest-app/extensions/windows-thumbnail/Cargo.toml -- -D warnings
          cargo test --locked --manifest-path apps/readest-app/extensions/windows-thumbnail/Cargo.toml
      - name: Windows WebView2 tests
        shell: pwsh
        run: ./scripts/ci/test-windows.ps1
      - name: Upload diagnostic logs and UI evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: remote-windows-checks
          path: |
            .v2-artifacts/*.log
            .v2-artifacts/verification/*.png
          if-no-files-found: ignore
          retention-days: 7

  companions:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-readest
      - name: Install KOReader test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y luajit luarocks libsqlite3-dev
          sudo luarocks --lua-version=5.1 install busted
          sudo luarocks --lua-version=5.1 install lsqlite3complete
      - name: Test companion integrations
        run: |
          pnpm --filter @readest/readest-app test:extension
          pnpm lint:lua
          pnpm test:lua
          python3 -m unittest discover -s apps/readest-calibre-plugin/tests -v
