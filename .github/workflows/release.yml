name: Release Readest Remote

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
      - '!v*-x[0-9]*'

permissions:
  contents: read

concurrency:
  group: readest-remote-release-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  build:
    permissions:
      contents: write
    uses: ./.github/workflows/release-build.yml
    with:
      source_sha: ${{ github.sha }}
      publish: ${{ startsWith(github.ref, 'refs/tags/v') }}
    secrets: inherit
